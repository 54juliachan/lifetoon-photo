<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI 漫畫拍貼機</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>穿越漫畫次元</h1>
        <p>按下拍攝，AI 將為你繪製專屬漫畫像！</p>
        
        <div class="upload-section">
            <div id="camera-container">
                <video id="webcam" autoplay playsinline></video>
                <img id="guideOverlay" src="./guide.png" class="guide-overlay">
                <div id="countdown" class="manga-countdown">3</div>
                <canvas id="snapshot" class="hidden"></canvas>
            </div>

            <div class="button-group">
                <button id="openCameraBtn">開啟相機</button>
                <button id="takePhotoBtn" class="hidden">立即拍攝 (3秒倒數)</button>
                <button id="generateBtn" class="hidden">開始生成漫畫像</button>
            </div>
        </div>

        <div id="resultArea" class="result-section hidden">
            <div id="previewBox" class="box hidden">
                <h3>原始照片</h3>
                <img id="previewImg" src="#" class="hidden">
            </div>
            <div id="resultBox" class="box hidden">
                <h3>AI 漫畫生成結果</h3>
                <div id="loading" class="hidden">漫畫家作畫中...</div>
                <img id="resultImg" src="#" class="hidden">
                <button id="removeBgBtn" class="hidden">✨ 自動去背</button>
                <div id="qrcode-container" class="hidden" style="margin-top: 20px; text-align: center;">
                    <p>掃描 QR Code 下載漫畫肖像：</p>
                    <div id="qrcode" style="display: flex; justify-content: center; margin: 10px 0;"></div>
                    <a id="downloadLink" href="#" target="_blank" style="color: #4CAF50; text-decoration: underline;">點此開啟圖片</a>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/app_web.js"></script>
</body>
</html>
