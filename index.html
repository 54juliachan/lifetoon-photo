<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifetoon | 穿越漫畫次元拍貼機</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Oswald:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>
<body>
    <div class="container">
        <header>
            <h1>穿越漫畫次元</h1>
            <p>按下拍攝，AI 將為你繪製專屬漫畫像！</p>
        </header>
        
        <div class="upload-section">
            <div id="camera-container">
                <video id="webcam" autoplay playsinline></video>
                <img id="guideOverlay" src="./guide.png" class="guide-overlay">
                <div id="countdown" class="manga-countdown">3</div>
                <canvas id="snapshot" class="hidden"></canvas>
            </div>

            <div class="button-group">
                <button id="openCameraBtn">開啟相機</button>
                <button id="takePhotoBtn" class="hidden">立即拍攝 (3秒倒數)</button>
                <button id="generateBtn" class="hidden">確認照片並全自動處理</button>
            </div>
        </div>

        <div id="resultArea" class="result-section hidden">
            <div id="previewBox" class="box hidden">
                <h3>原始照片</h3>
                <div class="img-frame">
                    <img id="previewImg" src="#" class="hidden">
                </div>
            </div>
            
            <div id="resultBox" class="box hidden">
                <h3>漫畫拍貼結果</h3>
                <div id="loading" class="hidden">處理中...</div>
                
                <div id="final-layout">
                    <div id="image-placeholder">
                        <span id="image-loading-text">⏳ 圖片生成中...</span>
                        <img id="resultImg" src="#" class="hidden">
                    </div>
                    
                    <div id="qr-placeholder">
                        <span id="qr-loading-text">⏳ 等待雲端上傳...</span>
                        
                        <div id="qrcode-content" class="hidden">
                            <p class="qr-title">掃描下載專屬漫畫！</p>
                            <div id="qrcode"></div>
                            <a id="downloadLink" href="#" target="_blank">點此開啟雲端原圖</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-actions">
            <button id="homeBtn" class="hidden">回到主頁</button>
        </div>
    </div>
    <script type="module" src="/app_web.js"></script>
</body>
</html>
