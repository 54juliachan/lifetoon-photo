<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lifetoon | 1. 拍攝照片</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>穿越漫畫次元</h1>
            <p>第一步：對準框線，按下拍攝！</p>
        </header>
        
        <div class="upload-section">
            <div id="camera-container">
                <video id="webcam" autoplay playsinline></video>
                <img id="guideOverlay" src="./guide.png" class="guide-overlay">
                <div id="countdown" class="manga-countdown">3</div>
                <canvas id="snapshot" class="hidden"></canvas>
            </div>

            <div class="button-group">
                <button id="openCameraBtn">開啟相機</button>
                <button id="takePhotoBtn" class="hidden">立即拍攝 (3秒倒數)</button>
            </div>
        </div>
    </div>
    <script type="module">
        const webcam = document.getElementById('webcam');
        const snapshotCanvas = document.getElementById('snapshot');
        const openCameraBtn = document.getElementById('openCameraBtn');
        const takePhotoBtn = document.getElementById('takePhotoBtn');
        const countdownDisplay = document.getElementById('countdown');

        openCameraBtn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                webcam.srcObject = stream;
                openCameraBtn.classList.add('hidden');
                takePhotoBtn.classList.remove('hidden');
            } catch (err) { alert("無法開啟相機。"); }
        };

        takePhotoBtn.onclick = () => {
            let count = 3;
            takePhotoBtn.disabled = true;
            countdownDisplay.style.display = 'block';
            countdownDisplay.innerText = count;
            countdownDisplay.classList.add('animate');

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownDisplay.innerText = count;
                    countdownDisplay.classList.remove('animate');
                    void countdownDisplay.offsetWidth; 
                    countdownDisplay.classList.add('animate');
                } else {
                    clearInterval(timer);
                    captureAndGo();
                }
            }, 1000);
        };

        function captureAndGo() {
    const context = snapshotCanvas.getContext('2d');
    const targetWidth = 600;
    const targetHeight = 800;
    snapshotCanvas.width = targetWidth;
    snapshotCanvas.height = targetHeight;

    context.save();
    // 處理前鏡頭鏡像翻轉
    context.translate(targetWidth, 0);
    context.scale(-1, 1);

    // 🌟 關鍵修正：計算真實鏡頭比例與目標比例，進行「置中裁切」而非「壓縮」
    const videoRatio = webcam.videoWidth / webcam.videoHeight;
    const targetRatio = targetWidth / targetHeight;
    let sw, sh, sx, sy;

    if (videoRatio > targetRatio) {
        // 鏡頭畫面太寬：裁切左右
        sh = webcam.videoHeight;
        sw = sh * targetRatio;
        sx = (webcam.videoWidth - sw) / 2;
        sy = 0;
    } else {
        // 鏡頭畫面太高：裁切上下
        sw = webcam.videoWidth;
        sh = sw / targetRatio;
        sx = 0;
        sy = (webcam.videoHeight - sh) / 2;
    }

    // 將裁切好的正確比例畫布輸出，這樣就不會變形了
    context.drawImage(webcam, sx, sy, sw, sh, 0, 0, targetWidth, targetHeight);
    context.restore();

    // 將正確比例的照片存入 session 並跳轉
    const dataUrl = snapshotCanvas.toDataURL('image/jpeg');
    sessionStorage.setItem('capturedPhoto', dataUrl);
    window.location.href = 'process.html';
}
    </script>
</body>
</html>
