<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lifetoon | 2. AI 轉換中</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI 漫畫生成</h1>
            <p id="statusText">確認您的照片，點擊開始轉換！</p>
        </header>

        <div class="result-section">
            <div id="previewBox" class="box">
                <div class="img-frame">
                    <img id="previewImg" src="">
                </div>
            </div>
            
            <div id="loading" class="hidden">🎨 AI 繪圖中，請稍候...</div>
        </div>

        <div class="button-group">
            <button id="reTakeBtn" onclick="window.location.href='index.html'">重新拍攝</button>
            <button id="generateBtn">開始轉換</button>
        </div>

        <div id="eggModal" class="hidden interactive-modal">
            <div id="eggIntro">
                <h2 class="manga-title">您拾獲了一顆神祕的蛋</h2>
                <p>輕撫注入故事以孵化</p>
                <button id="startHatchBtn" style="margin-top:25px;">開始孵化</button>
            </div>
            <div id="textInputSection" class="hidden">
                <h2>我穿越了漫畫世界，<br>這一世我要成為——</h2>
                <input type="text" id="roleInput" placeholder="例如：最強魔法師" maxlength="10">
                <p class="input-note">※ 字數限 10 字以內</p>
                <button id="startIsekaiBtn" class="primary-btn">開始穿越</button>
            </div>
            <div id="eggInteraction" class="hidden">
                <h3 id="eggStatusText">輕撫蛋來注入能量...</h3>
                <div class="progress-container">
                    <div id="eggProgress"></div>
                </div>
                
                <div id="eggContainer">
                    <div id="theEgg"></div>
                    <div id="eggGlow"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./process.js"></script>
</body>
</html>
