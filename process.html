<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lifetoon | 2. AI 轉換中</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI 漫畫生成</h1>
            <p id="statusText">確認您的照片，點擊開始轉換！</p>
        </header>

        <div class="result-section">
            <div id="previewBox" class="box">
                <div class="img-frame">
                    <img id="previewImg" src="">
                </div>
            </div>
            
            <div id="loading" class="hidden">🎨 AI 繪圖中，請稍候...</div>
        </div>

        <div class="button-group">
            <button id="reTakeBtn" onclick="window.location.href='index.html'">重新拍攝</button>
            <button id="generateBtn">開始轉換</button>
        </div>
    </div>

    <script type="module" src="./process.js"></script>
</body>
</html>
