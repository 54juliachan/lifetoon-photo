<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lifetoon | 3. 完成結果</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>您的專屬漫畫</h1>
            <p>處理完成！請掃描右側 QR Code 儲存圖片。</p>
        </header>

        <div id="final-layout">
            <div id="image-placeholder">
                <img id="resultImg" src="">
            </div>
            
            <div id="qr-placeholder">
                <div id="qrcode-content">
                    <p class="qr-title">掃描下載</p>
                    <div id="qrcode"></div>
                </div>
            </div>
        </div>

        <div class="footer-actions">
            <button id="homeBtn" onclick="window.location.href='index.html'">回首頁(100s)</button>
        </div>
    </div>

    <script type="module">
        import QRCode from 'qrcode';
        const resultImg = document.getElementById('resultImg');
        const qrcodeElement = document.getElementById('qrcode');
        const homeBtn = document.getElementById('homeBtn'); // 🌟 抓取按鈕元素

        // 從 Session 取出雲端網址
        const downloadUrl = sessionStorage.getItem('finalResultUrl');

        if (downloadUrl) {
            // ✅ 直接將結果圖片的來源設為 ImgBB 的雲端網址
            resultImg.src = downloadUrl;
            
            // 產生 QR Code
            QRCode.toCanvas(document.createElement('canvas'), downloadUrl, { width: 200 }, (err, canvas) => {
                qrcodeElement.appendChild(canvas);
            });
        } else {
            alert("找不到結果圖片，請重新拍攝");
            window.location.href = 'index.html'; // 防呆
        }

        // 2. 🌟 新增：100秒自動倒數與跳轉邏輯
        let countdownTime = 100; // 設定倒數秒數

        const timer = setInterval(() => {
            countdownTime--; // 每秒減 1
            
            if (countdownTime > 0) {
                // 更新按鈕文字
                homeBtn.innerText = `回首頁(${countdownTime}s)`;
            } else {
                // 時間到，清除計時器並跳轉回首頁
                clearInterval(timer);
                window.location.href = 'index.html';
            }
        }, 1000); // 1000 毫秒 = 1 秒
    </script>
</body>
</html>
